# Lightweight entry point for the official Moran fixed four-key dictionary.
# The full upstream schema has optional Lua/OpenCC features; this keeps only
# the table translator so it can coexist with the personal new schema.
schema:
  schema_id: moran_fixed_simp
  name: 魔然·简四码
  version: "20260917"
  description: |
    莫然简体固定四码；二字词四码，三字词三码，四字以上四码。

engine:
  processors:
    - ascii_composer
    - key_binder
    - recognizer
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - uniquifier

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz"
  max_code_length: 4
  auto_select: true
  auto_clear: max_length

translator:
  dictionary: moran_fixed_simp
  enable_sentence: false
  enable_user_dict: false
  enable_completion: false
  enable_encoder: true
  encode_commit_history: false
  initial_quality: 1

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default

recognizer:
  import_preset: default
